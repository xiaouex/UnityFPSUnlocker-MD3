name: Build UnityFPSUnlocker Xposed Module (Signed Release)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xposed module
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Set up NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Set NDK env
        run: echo "NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Clone zygisk_module native source
        run: |
          git clone --depth 1 --branch zygisk_module \
            https://github.com/xiaouex/UnityFPSUnlocker-MD3.git native_src

      - name: Build & install Abseil for Android
        run: |
          git clone --depth 1 --branch 20240116.1 \
            https://github.com/abseil/abseil-cpp.git abseil-cpp
          cd abseil-cpp
          for ABI in arm64-v8a armeabi-v7a; do
            case $ABI in
              arm64-v8a)   TRIPLE=aarch64-linux-android ;;
              armeabi-v7a) TRIPLE=armv7a-linux-androideabi ;;
            esac
            cmake -B build-$ABI -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-21 \
              -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/absl-install/$ABI \
              -DABSL_BUILD_TESTING=OFF \
              -DABSL_PROPAGATE_CXX_STD=ON
            cmake --build build-$ABI
            cmake --install build-$ABI
          done

      - name: Build libUnityFPSUnlocker.so
        run: |
          cd native_src
          for ABI in arm64-v8a armeabi-v7a; do
            cmake -B build-$ABI -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-21 \
              -Dabsl_DIR=$GITHUB_WORKSPACE/absl-install/$ABI/lib/cmake/absl
            cmake --build build-$ABI
          done
          mkdir -p so_out
          cp UnityFPSUnlocker/libs/Release/arm64-v8a.so   so_out/
          cp UnityFPSUnlocker/libs/Release/armeabi-v7a.so so_out/
          mkdir -p app/src/main/jniLibs/arm64-v8a \
                   app/src/main/jniLibs/armeabi-v7a
          cp native_src/so_out/arm64-v8a.so \
             app/src/main/jniLibs/arm64-v8a/libUnityFPSUnlocker.so
          cp native_src/so_out/armeabi-v7a.so \
             app/src/main/jniLibs/armeabi-v7a/libUnityFPSUnlocker.so

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 未配置！"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME=$NDK_PATH
          ./gradlew assembleRelease --stacktrace


      - name: Get version and build release name
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*"\K[^"]+' app/build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 app/build.gradle 中提取 versionName"
            exit 1
          fi
          VERSION=${VERSION//+/}           # 去掉加号
          RELEASE_NAME="V${VERSION}-MD3"
          APK_NAME="UnityFPSUnlocker-${RELEASE_NAME}.apk"
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME"        >> $GITHUB_OUTPUT
          echo "Release 名称: $RELEASE_NAME"
          echo "APK 文件名: $APK_NAME"

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "${{ steps.ver.outputs.apk_name }}"

      - name: Upload APK to existing Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view MD3 > /dev/null 2>&1; then
            echo "::error::Release 'MD3' 不存在！请先在 GitHub Releases 页面基于 MD3 tag 创建一次 Release"
            exit 1
          fi

          # 更新 Release 标题为 V<versionName>-MD3（如 V1.4-MD3）
          gh release edit MD3 \
            --title "${{ steps.ver.outputs.release_name }}"

          # 上传 APK，--clobber 同名覆盖，不会新建 tag
          gh release upload MD3 \
            "${{ steps.ver.outputs.apk_name }}" --clobber

          echo "已上传到 MD3 Release：${{ steps.ver.outputs.apk_name }}"
          echo "Release 标题已更新为：${{ steps.ver.outputs.release_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
