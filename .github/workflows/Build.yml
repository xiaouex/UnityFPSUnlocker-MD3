name: Build Xposed module and publish to MD3 release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout xposed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout zygisk_module branch to native-source
        uses: actions/checkout@v4
        with:
          ref: zygisk_module
          path: native-source
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37,build-tools;37.0.0,cmake;3.22.1,ndk;27.2.12479018"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Force accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null 2>&1 || true

      - name: Build libUnityFPSUnlocker.so for arm64-v8a and armeabi-v7a
        shell: bash
        run: |
          set -euo pipefail

          NDK="${ANDROID_SDK_ROOT}/ndk/27.2.12479018"
          ABSEIL_SRC="${RUNNER_TEMP}/abseil-cpp"
          NATIVE_ROOT="${GITHUB_WORKSPACE}/native-source"

          git clone --depth 1 --branch 20250127.1 https://github.com/abseil/abseil-cpp.git "${ABSEIL_SRC}"

          for ABI in arm64-v8a armeabi-v7a; do
            PREFIX="${RUNNER_TEMP}/absl-install/${ABI}"
            BUILD_DIR="${RUNNER_TEMP}/absl-build/${ABI}"
            NATIVE_BUILD_DIR="${RUNNER_TEMP}/native-build/${ABI}"

            cmake -S "${ABSEIL_SRC}" -B "${BUILD_DIR}" \
              -DCMAKE_TOOLCHAIN_FILE="${NDK}/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="${ABI}" \
              -DANDROID_PLATFORM=android-28 \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="${PREFIX}" \
              -DABSL_PROPAGATE_CXX_STD=ON \
              -DABSL_ENABLE_INSTALL=ON \
              -DABSL_BUILD_TESTING=OFF

            cmake --build "${BUILD_DIR}" --parallel 2
            cmake --install "${BUILD_DIR}"

            cmake -S "${NATIVE_ROOT}" -B "${NATIVE_BUILD_DIR}" \
              -DCMAKE_TOOLCHAIN_FILE="${NDK}/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="${ABI}" \
              -DANDROID_PLATFORM=android-28 \
              -DANDROID_STL=c++_static \
              -Dabsl_DIR="${PREFIX}/lib/cmake/absl" \
              -DCMAKE_BUILD_TYPE=Release

            cmake --build "${NATIVE_BUILD_DIR}" --parallel 2

            SO_FILE="${NATIVE_ROOT}/libs/Release/${ABI}.so"
            if [[ ! -f "${SO_FILE}" ]]; then
              echo "Native library not found: ${SO_FILE}" >&2
              find "${NATIVE_ROOT}" -type f -name '*.so' -print >&2
              exit 1
            fi

            mkdir -p "${GITHUB_WORKSPACE}/app/src/main/lib/${ABI}"
            cp "${SO_FILE}" "${GITHUB_WORKSPACE}/app/src/main/lib/${ABI}/libUnityFPSUnlocker.so"
          done

      - name: Decode release keystore from base64 secret
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "Missing secret: KEYSTORE_BASE64" >&2
            exit 1
          fi

          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew --no-daemon clean assembleRelease

          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "${APK_PATH}" ]]; then
            echo "Release APK was not produced" >&2
            exit 1
          fi

          mkdir -p release-artifacts
          cp "${APK_PATH}" release-artifacts/UnityFPSUnlocker-Xposed.apk

          VERSION_NAME="$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*versionName *= *"([^"]+)".*/\1/')"
          if [[ -z "${VERSION_NAME}" ]]; then
            echo "Could not parse versionName from app/build.gradle" >&2
            exit 1
          fi

          echo "VERSION_NAME=${VERSION_NAME}" >> "${GITHUB_ENV}"
          echo "RELEASE_TITLE=V${VERSION_NAME}-MD3" >> "${GITHUB_ENV}"

      - name: Publish to existing MD3 tag as GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: MD3
        run: |
          set -euo pipefail

          # 不创建新 tag；要求仓库里已经存在 MD3 tag
          git fetch --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}" || true
          if ! git rev-parse --verify "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} does not exist. Please create the MD3 tag manually first, and do not let the workflow create a new tag." >&2
            exit 1
          fi

          APK_FILE="release-artifacts/UnityFPSUnlocker-Xposed.apk"
          NOTES="Automated signed Xposed module release built from xposed branch. Native libraries compiled from zygisk_module branch."

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --title "${RELEASE_TITLE}" --notes "${NOTES}"
            gh release upload "${TAG_NAME}" "${APK_FILE}" --clobber
          else
            gh release create "${TAG_NAME}" "${APK_FILE}" \
              --title "${RELEASE_TITLE}" \
              --notes "${NOTES}" \
              --verify-tag
          fi