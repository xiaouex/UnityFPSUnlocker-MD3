name: Build Xposed Module (MD3)


on:
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout zygisk_module branch
        uses: actions/checkout@v4
        with:
          ref: zygisk_module
          path: zygisk_module

      - name: Build Abseil for Android (arm64-v8a / armeabi-v7a)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME}}"
          echo "Using NDK: $NDK"

          git clone --depth 1 --branch 20240722.0 https://github.com/abseil/abseil-cpp.git absl-src

          for ABI in arm64-v8a armeabi-v7a; do
            echo "=== Building Abseil for $ABI ==="
            cmake -S absl-src -B "absl-build/$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-28 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$PWD/absl-install/$ABI" \
              -DABSL_BUILD_TESTING=OFF \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DABSL_PROPAGATE_CXX_STD=ON
            cmake --build "absl-build/$ABI" --parallel
            cmake --install "absl-build/$ABI"
          done

          echo "=== Abseil install results ==="
          ls absl-install/arm64-v8a/lib/cmake/absl

      - name: Build libUnityFPSUnlocker.so (arm64-v8a / armeabi-v7a)
        run: |
          cd zygisk_module
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME}}"

          # 该分支 CMakeLists 会把 so 输出为 libs/Release/<ABI>.so（无 lib 前缀）
          for ABI in arm64-v8a armeabi-v7a; do
            echo "=== Building libUnityFPSUnlocker.so for $ABI ==="
            cmake -B "build/$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-28 \
              -DCMAKE_BUILD_TYPE=Release \
              -Dabsl_DIR="$GITHUB_WORKSPACE/absl-install/$ABI/lib/cmake/absl"
            cmake --build "build/$ABI" --parallel


            SO_PATH="libs/Release/$ABI.so"
            if [ ! -f "$SO_PATH" ]; then
              echo "ERROR: $SO_PATH not found!" >&2
              exit 1
            fi
            # 重命名为 libUnityFPSUnlocker.so（jniLibs 规范命名）
            cp "$SO_PATH" "../so_out/$ABI/libUnityFPSUnlocker.so"
          done

          echo "=== Build results ==="
          ls -R ../so_out

      - name: Checkout xposed branch
        uses: actions/checkout@v4
        with:
          ref: xposed
          path: xposed

      - name: Copy .so into xposed module
        run: |
          for ABI in arm64-v8a armeabi-v7a; do
            mkdir -p "xposed/app/src/main/lib/$ABI"
            cp "so_out/$ABI/libUnityFPSUnlocker.so" "xposed/app/src/main/lib/$ABI/"
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64:   ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > xposed/release.keystore
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed APK
        run: |
          cd xposed
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify signature
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          APK=$(find xposed/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Verifying: $APK"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Read versionName and rename APK
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' xposed/app/build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "versionName not found in app/build.gradle" >&2
            exit 1
          fi
          RELEASE_NAME="V${VERSION}-MD3"
          APK=$(find xposed/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_NAME="UnityFPSUnlocker-${RELEASE_NAME}.apk"
          cp "$APK" "$APK_NAME"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload to MD3 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: MD3
          name: ${{ steps.ver.outputs.release_name }}
          files: ${{ steps.ver.outputs.apk_name }}
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
