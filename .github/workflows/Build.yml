name: Build and release Xposed module

on:
  push:
    branches:
      - xposed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xposed-release-md3
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Xposed module
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout native source from zygisk_module
        uses: actions/checkout@v4
        with:
          ref: zygisk_module
          path: native-source
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-37
            build-tools;37.0.0
            cmake;3.22.1
            ndk;27.2.12479018

      - name: Build native libraries for both ABIs
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          ABSEIL_SOURCE="$RUNNER_TEMP/abseil-cpp"
          NATIVE_DIR="$GITHUB_WORKSPACE/native-source"

          # Native CMake uses find_package(absl), so build and install Abseil
          # separately for each Android ABI first.
          git clone --depth 1 --branch 20250127.1 \
            https://github.com/abseil/abseil-cpp.git "$ABSEIL_SOURCE"

          for ABI in arm64-v8a armeabi-v7a; do
            PREFIX="$RUNNER_TEMP/absl-install/$ABI"

            cmake -S "$ABSEIL_SOURCE" -B "$RUNNER_TEMP/absl-build/$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-28 \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$PREFIX" \
              -DABSL_PROPAGATE_CXX_STD=ON \
              -DABSL_ENABLE_INSTALL=ON \
              -DABSL_BUILD_TESTING=OFF

            cmake --build "$RUNNER_TEMP/absl-build/$ABI" --parallel 2
            cmake --install "$RUNNER_TEMP/absl-build/$ABI"

            cmake -S "$NATIVE_DIR" -B "$RUNNER_TEMP/native-build/$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-28 \
              -DANDROID_STL=c++_static \
              -Dabsl_DIR="$PREFIX/lib/cmake/absl" \
              -DCMAKE_BUILD_TYPE=Release

            cmake --build "$RUNNER_TEMP/native-build/$ABI" --parallel 2

            OUTPUT="$NATIVE_DIR/libs/Release/$ABI.so"
            test -f "$OUTPUT" || {
              echo "Expected native library was not produced: $OUTPUT" >&2
              find "$NATIVE_DIR" -type f -name '*.so' -print >&2
              exit 1
            }

            install -D "$OUTPUT" \
              "$GITHUB_WORKSPACE/app/src/main/lib/$ABI/libUnityFPSUnlocker.so"
          done

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "Missing repository secret KEYSTORE_BASE64." >&2
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew --no-daemon clean assembleRelease

          APK="$(find app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" || {
            echo "Release APK was not produced." >&2
            exit 1
          }

          mkdir -p release-artifacts
          cp "$APK" release-artifacts/UnityFPSUnlocker-Xposed.apk

          VERSION_NAME="$(
            sed -nE \
              's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              app/build.gradle | head -n 1
          )"
          test -n "$VERSION_NAME" || {
            echo "Could not read versionName from app/build.gradle." >&2
            exit 1
          }

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=V${VERSION_NAME}-MD3" >> "$GITHUB_ENV"

      - name: Publish APK to the existing MD3 tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: MD3
        shell: bash
        run: |
          set -euo pipefail

          # Require the tag to exist; do not create it.
          git fetch --force origin \
            "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          git rev-parse --verify "refs/tags/${TAG_NAME}" >/dev/null

          APK="release-artifacts/UnityFPSUnlocker-Xposed.apk"
          NOTES="Automated signed Xposed module build for version ${VERSION_NAME}."

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES"
            gh release upload "$TAG_NAME" "$APK" --clobber
          else
            gh release create "$TAG_NAME" "$APK" \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES" \
              --verify-tag
          fi